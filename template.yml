
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Medicine API Lambda and DynamoDB deployment

Resources:

  MedicineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MedicineTable
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: medicine_id
          AttributeType: S

      KeySchema:
        - AttributeName: medicine_id
          KeyType: HASH

  MedicineHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  CreateMedicineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: create-medicine
      CodeUri: backend/lambda_functions/create_medicine/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128

      Environment:
        Variables:
          MEDICINE_TABLE: !Ref MedicineTable

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MedicineTable

      Events:
        CreateMedicine:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicineHttpApi
            Path: /medicines
            Method: POST

Outputs:

  MedicineTableName:
    Description: DynamoDB table name
    Value: !Ref MedicineTable

  CreateMedicineFunctionName:
    Description: Lambda function name
    Value: !Ref CreateMedicineFunction

  MedicineApiUrl:
    Description: Medicine API Gateway endpoint
    Value: !Sub 'https://${MedicineHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
