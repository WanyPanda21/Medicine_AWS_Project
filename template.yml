
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Medicine API Lambda and DynamoDB deployment

Resources:

  MedicineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MedicineTable
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: medicine_id
          AttributeType: S

      KeySchema:
        - AttributeName: medicine_id
          KeyType: HASH

  MedicineHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
  # New Create Medicines Lambda
  CreateMedicineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: create_medicine
      CodeUri: backend/lambda_functions/create_medicine/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128

      Environment:
        Variables:
          MEDICINE_TABLE: !Ref MedicineTable

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MedicineTable

      Events:
        CreateMedicine:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicineHttpApi
            Path: /medicines
            Method: POST

  # New Get Medicines Lambda
  GetMedicinesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: get_medicines
      CodeUri: backend/get_medicines/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128

      Environment:
        Variables:
          MEDICINE_TABLE: Medicines

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !Sub
                - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Medicines
                - {}

      Events:
        GetMedicines:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicineHttpApi
            Path: /medicines
            Method: GET

Outputs:

  MedicineTableName:
    Description: DynamoDB table name
    Value: !Ref MedicineTable

  CreateMedicineFunctionName:
    Description: Lambda function name
    Value: !Ref CreateMedicineFunction
  GetMedicinesFunctionName:
    Description: Get Medicines Lambda
    Value: !Ref GetMedicinesFunction

  MedicineApiUrl:
    Description: Medicine API Gateway endpoint
    Value: !Sub 'https://${MedicineHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
