
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Medicine Management FastAPI, Lambda and DynamoDB

Resources:

  MedicineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MedicineTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: medicine_id
          AttributeType: S
      KeySchema:
        - AttributeName: medicine_id
          KeyType: HASH

  MedicineHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  FastApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: medicine_fastapi
      CodeUri: backend/
      Handler: main.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          MEDICINE_TABLE: !Ref MedicineTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MedicineTable
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicineHttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicineHttpApi
            Path: /{proxy+}
            Method: ANY

  # Retain the existing Lambda handlers for compatibility.
  # FastAPI now owns the public API routes.
  CreateMedicineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: create_medicine
      CodeUri: backend/lambda_functions/create_medicine/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          MEDICINE_TABLE: !Ref MedicineTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MedicineTable

  GetMedicinesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: get_medicines
      CodeUri: backend/lambda_functions/get_medicines/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          MEDICINE_TABLE: !Ref MedicineTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MedicineTable

Outputs:

  MedicineTableName:
    Description: DynamoDB table name
    Value: !Ref MedicineTable

  FastApiFunctionName:
    Description: FastAPI Lambda function
    Value: !Ref FastApiFunction

  CreateMedicineFunctionName:
    Description: Existing create Lambda function
    Value: !Ref CreateMedicineFunction

  GetMedicinesFunctionName:
    Description: Existing get Lambda function
    Value: !Ref GetMedicinesFunction

  MedicineApiUrl:
    Description: Medicine application URL
    Value: !Sub 'https://${MedicineHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
